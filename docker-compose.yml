services:

  postgres:
    image: postgres:17
    container_name: cybersentinel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cybersentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d cybersentinel"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: cybersentinel-backend
    restart: unless-stopped

    environment:
      APP_NAME: CyberSentinel AI
      APP_VERSION: 1.0.0
      DEBUG: "False"

      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/cybersentinel

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      GROQ_API_KEY: ${GROQ_API_KEY}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./knowledge_base:/app/knowledge_base:ro


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: cybersentinel-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data: